# Generated by the Firebase CLI, then edited — see the `env:` block below.
#
# Deploys yemicoreerp.web.app on every push to main.
name: Deploy to Firebase Hosting on merge
on:
  push:
    branches:
      - main
jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Pinned to 20 to match package.json's "engines": { "node": ">=20 <22" }.
      # Without this the runner uses whatever Node it defaults to, which drifts
      # over time and currently trips an EBADENGINE warning.
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      # The env: block is the important part and is NOT generated by the
      # Firebase CLI. Vite inlines import.meta.env.VITE_* values into the
      # bundle at BUILD time, and this build runs on GitHub's runner, which
      # has no .env file. Omit these and the deploy silently succeeds while
      # producing an app with no database connection — src/supabase/client.js
      # exports `supabase = null`, every module falls back to its built-in
      # demo records, and users see seed data instead of real data. That is
      # exactly what happened to the Vercel deployment on 2026-07-27.
      #
      # These come from GitHub → Settings → Secrets and variables → Actions.
      - run: npm ci && npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_COMPANY_DOC: ${{ secrets.VITE_COMPANY_DOC }}
          VITE_STORAGE_PREFIX: ${{ secrets.VITE_STORAGE_PREFIX }}
          VITE_USE_PER_RECORD_SYNC: ${{ secrets.VITE_USE_PER_RECORD_SYNC }}

      # Fail loudly if the credentials never made it in, rather than shipping
      # a demo-data build to production and finding out from users.
      - name: Verify Supabase credentials were baked into the bundle
        run: |
          if ! grep -rq "supabase.co" dist/assets/ 2>/dev/null; then
            echo "::error::No Supabase URL found in the built bundle. The VITE_* repository secrets are missing or empty — this build would deploy an app that shows demo data instead of real data. Refusing to deploy."
            exit 1
          fi
          echo "Supabase URL present in bundle — safe to deploy."

      # Which data engine is this build shipping? This must never be implicit.
      #
      # 2026-07-30: the per-record engine was believed to be live in production
      # for ~30 minutes while the app was in fact still writing the legacy
      # whole-document blob, because this secret was blank and
      # usePerRecordSync.js compares it with a strict === 'true'. A blank or
      # misspelled value therefore means "legacy", silently, with no error and
      # nothing in the deploy log to contradict the assumption. Every
      # data-disappearance incident on this app has traced back to the legacy
      # engine, so shipping it BY ACCIDENT is the single most expensive
      # mistake this pipeline can make. Require the value to be spelled out.
      - name: Verify the data-sync engine was chosen explicitly
        env:
          FLAG: ${{ secrets.VITE_USE_PER_RECORD_SYNC }}
        run: |
          case "$FLAG" in
            true)
              echo "Data engine: PER-RECORD (per-row Supabase tables)." ;;
            false)
              echo "::warning::Data engine: LEGACY whole-document blob. This is the engine associated with every past data-loss incident on this app. Set the VITE_USE_PER_RECORD_SYNC secret to 'true' to use per-record sync." ;;
            "")
              echo "::error::VITE_USE_PER_RECORD_SYNC is not set. A blank value silently means 'legacy whole-document engine' — the engine behind this app's past data-loss incidents. Refusing to guess. Set the secret to 'true' or 'false' at Settings → Secrets and variables → Actions, then re-run."
              exit 1 ;;
            *)
              echo "::error::VITE_USE_PER_RECORD_SYNC is '$FLAG', which is neither 'true' nor 'false'. The app compares it with a strict === 'true', so any other value — including 'True', 'TRUE', '1', 'yes', or a stray space — silently selects the legacy engine. Refusing to deploy an ambiguous value."
              exit 1 ;;
          esac

      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_YEMICOREERP }}
          channelId: live
          projectId: yemicoreerp
