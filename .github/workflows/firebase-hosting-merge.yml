# Generated by the Firebase CLI, then edited — see the `env:` block below.
#
# Deploys yemicoreerp.web.app on every push to main.
name: Deploy to Firebase Hosting on merge
on:
  push:
    branches:
      - main
jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Pinned to 20 to match package.json's "engines": { "node": ">=20 <22" }.
      # Without this the runner uses whatever Node it defaults to, which drifts
      # over time and currently trips an EBADENGINE warning.
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      # The env: block is the important part and is NOT generated by the
      # Firebase CLI. Vite inlines import.meta.env.VITE_* values into the
      # bundle at BUILD time, and this build runs on GitHub's runner, which
      # has no .env file. Omit these and the deploy silently succeeds while
      # producing an app with no database connection — src/supabase/client.js
      # exports `supabase = null`, every module falls back to its built-in
      # demo records, and users see seed data instead of real data. That is
      # exactly what happened to the Vercel deployment on 2026-07-27.
      #
      # These come from GitHub → Settings → Secrets and variables → Actions.
      - run: npm ci && npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_COMPANY_DOC: ${{ secrets.VITE_COMPANY_DOC }}
          VITE_STORAGE_PREFIX: ${{ secrets.VITE_STORAGE_PREFIX }}
          VITE_USE_PER_RECORD_SYNC: ${{ secrets.VITE_USE_PER_RECORD_SYNC }}

      # Fail loudly if the credentials never made it in, rather than shipping
      # a demo-data build to production and finding out from users.
      - name: Verify Supabase credentials were baked into the bundle
        run: |
          if ! grep -rq "supabase.co" dist/assets/ 2>/dev/null; then
            echo "::error::No Supabase URL found in the built bundle. The VITE_* repository secrets are missing or empty — this build would deploy an app that shows demo data instead of real data. Refusing to deploy."
            exit 1
          fi
          echo "Supabase URL present in bundle — safe to deploy."

      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_YEMICOREERP }}
          channelId: live
          projectId: yemicoreerp
