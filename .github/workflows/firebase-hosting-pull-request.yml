# Generated by the Firebase CLI, then edited — see the `env:` block below.
#
# Builds a temporary preview site for each pull request and comments the URL
# on the PR. The `if:` guard is the CLI's own — it skips PRs from forks,
# which cannot read repository secrets anyway.
name: Deploy to Firebase Hosting on PR
on: pull_request
permissions:
  checks: write
  contents: read
  pull-requests: write
jobs:
  build_and_preview:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'

      # Same reasoning as firebase-hosting-merge.yml: Vite inlines VITE_*
      # at build time and the runner has no .env, so without these the
      # preview would show demo data rather than reproducing production.
      #
      # NOTE: these are the PRODUCTION Supabase credentials, so preview
      # builds read and write the live database. That is deliberate — a
      # preview showing fake data would not tell you whether a change is
      # safe. But it does mean anything you click in a preview affects real
      # records. If a separate staging Supabase project is ever created,
      # point these at it instead.
      - run: npm ci && npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_COMPANY_DOC: ${{ secrets.VITE_COMPANY_DOC }}
          VITE_STORAGE_PREFIX: ${{ secrets.VITE_STORAGE_PREFIX }}
          VITE_USE_PER_RECORD_SYNC: ${{ secrets.VITE_USE_PER_RECORD_SYNC }}

      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_YEMICOREERP }}
          projectId: yemicoreerp
