name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Lint
        # REVERTED 2026-07-27: briefly made this blocking after a sandbox
        # `npx eslint .` run showed 0 errors, but that sandbox had a
        # partially-broken node_modules and its eslint resolution was not
        # trustworthy — a real `npm ci` + `npm run lint` (this exact CI job)
        # showed the 293 pre-existing errors are still there. Back to
        # non-blocking until those are actually cleared file by file.
        run: npm run lint
        continue-on-error: true

      - name: Test
        run: npm test
        env:
          # Tests run against the legacy sync engine (no Supabase needed)
          VITE_USE_PER_RECORD_SYNC: 'false'

      - name: Build
        run: npm run build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: dist
          path: dist/
          retention-days: 7
